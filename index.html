<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a2f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Italian Web" />
    <meta name="description" content="Practice Italian listening with timed passages." />
    <title>Italian Web — Practice</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="top">
      <p class="brand">Italian Web</p>
      <h1 id="passageTitle">Loading…</h1>
      <p class="lede">Tap a line to practice just that stretch of audio.</p>
    </header>

    <main>
      <section class="cues" aria-label="Transcript">
        <ol id="cueList"></ol>
      </section>

      <section class="expressions" aria-label="Useful expressions" hidden>
        <h2>Useful expressions</h2>
        <ul id="expressionList"></ul>
      </section>
    </main>

    <section id="playerPanel" class="player" aria-label="Audio player">
      <div class="player-inner">
        <nav id="playlistPanel" class="playlist is-collapsed" aria-label="Passages">
          <button
            type="button"
            id="playlistToggle"
            class="playlist-toggle"
            aria-expanded="false"
            aria-controls="playlistBody"
          >
            <span class="playlist-toggle-label">
              <span class="playlist-label">Passages</span>
              <span id="playlistCount" class="playlist-count" aria-live="polite"></span>
            </span>
            <span id="playlistCollapsedSummary" class="playlist-collapsed-summary"></span>
            <span class="playlist-chevron" aria-hidden="true"></span>
          </button>
          <div id="playlistBody" class="playlist-body">
            <label class="playlist-filter">
              <span class="visually-hidden">Filter passages</span>
              <input
                type="search"
                id="passageFilter"
                placeholder="Filter by title or tag…"
                autocomplete="off"
                enterkeyhint="search"
              />
            </label>
            <div id="playlist" class="playlist-list" role="listbox" aria-label="Choose a passage"></div>
            <p id="playlistEmpty" class="playlist-empty" hidden>No passages match.</p>
          </div>
        </nav>

        <audio id="audio" preload="metadata"></audio>

        <div class="transport">
          <button type="button" id="prevPassage" class="skip-btn" aria-label="Previous passage">‹</button>
          <button type="button" id="playBtn" class="play-btn" aria-label="Play">
            <span class="icon-play" aria-hidden="true">▶</span>
            <span class="icon-pause" aria-hidden="true" hidden>❚❚</span>
          </button>
          <button type="button" id="nextPassage" class="skip-btn" aria-label="Next passage">›</button>

          <div class="scrub">
            <input
              type="range"
              id="seek"
              min="0"
              max="1000"
              value="0"
              step="1"
              aria-label="Seek"
            />
          </div>

          <div class="times">
            <span id="currentTime">0:00</span>
            <span class="times-sep">/</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls-row">
          <label class="toggle">
            <input type="checkbox" id="loopSegment" />
            <span>Loop</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="stopAtEnd" />
            <span>Stop</span>
          </label>
          <button type="button" id="clearFocus" class="ghost" aria-label="Play all" disabled>All</button>
          <div class="speed" role="group" aria-label="Playback speed">
            <div id="playbackRate" class="speed-options">
              <button type="button" class="speed-btn" data-rate="0.75" aria-pressed="false">0.75</button>
              <button type="button" class="speed-btn" data-rate="0.9" aria-pressed="false">0.9</button>
              <button type="button" class="speed-btn" data-rate="1" aria-pressed="true">1</button>
              <button type="button" class="speed-btn" data-rate="1.1" aria-pressed="false">1.1</button>
              <button type="button" class="speed-btn" data-rate="1.25" aria-pressed="false">1.25</button>
              <button type="button" class="speed-btn" data-rate="1.5" aria-pressed="false">1.5</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
