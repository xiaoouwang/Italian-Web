<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a2f" />
    <title>Italian Web — Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="top">
      <p class="brand">Italian Web</p>
      <h1>Sei complimenti per recuperare</h1>
      <p class="lede">Tap a line to practice just that stretch of audio.</p>
    </header>

    <main>
      <section class="player" aria-label="Audio player">
        <audio id="audio" src="assets/sei-complimenti.mp3" preload="metadata"></audio>

        <div class="transport">
          <button type="button" id="playBtn" class="play-btn" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5.14v13.72L19 12 8 5.14z" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z" />
            </svg>
          </button>

          <div class="scrub">
            <input
              type="range"
              id="seek"
              min="0"
              max="1000"
              value="0"
              step="1"
              aria-label="Seek"
            />
            <div class="times">
              <span id="currentTime">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
        </div>

        <div class="controls">
          <label class="toggle">
            <input type="checkbox" id="loopSegment" checked />
            <span>Loop segment</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="stopAtEnd" checked />
            <span>Stop at end</span>
          </label>
          <button type="button" id="clearFocus" class="ghost" disabled>Play all</button>
        </div>
      </section>

      <section class="cues" aria-label="Transcript">
        <ol id="cueList"></ol>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
